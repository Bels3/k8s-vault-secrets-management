apiVersion: v1
kind: ServiceAccount
metadata:
  name: policy-service
  namespace: insurance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-service
  namespace: insurance
  labels:
    app: policy-service
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-service
  template:
    metadata:
      labels:
        app: policy-service
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "policy-service"
        vault.hashicorp.com/agent-inject-secret-db-credentials.properties: "secret/data/insurance/policy-service"
        vault.hashicorp.com/agent-inject-template-db-credentials.properties: |
          {{- with secret "secret/data/insurance/policy-service" -}}
          db.username={{ .Data.data.db_username }}
          db.password={{ .Data.data.db_password }}
          {{- end }}
    spec:
      serviceAccountName: policy-service
      containers:
        - name: policy-service
          image: policy-service:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "insurancedb"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: policy-service
  namespace: insurance
  labels:
    app: policy-service
spec:
  selector:
    app: policy-service
  ports:
    - port: 80
      targetPort: 8080
