spring.application.name=policy-service

# -------------------------------------------------------
# Database credentials are NOT hardcoded here.
# They are injected at runtime by the Vault Agent sidecar
# and written to /vault/secrets/db-credentials.properties
# Spring Boot imports that file automatically on startup.
# -------------------------------------------------------
spring.config.import=optional:file:/vault/secrets/db-credentials.properties

spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres-service}:${DB_PORT:5432}/${DB_NAME:insurancedb}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Actuator - health checks visible to K8s probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
server.port=8080
